<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloCitizen - Choix du cadeau</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h2 class="text-center mb-4">Choix du cadeau</h2>

        <div id="noGiftsAlert" class="alert alert-warning d-none">Aucun cadeau disponible pour cet habitant.</div>

        <div id="giftsContainer" class="d-none">
            <div id="giftsCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-indicators" id="carousel-indicators"></div>
                <div class="carousel-inner" id="carousel-inner"></div>

                <button class="carousel-control-prev" type="button" data-bs-target="#giftsCarousel"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#giftsCarousel"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
            <div class="mt-2 text-center"><small class="text-muted">Cliquez sur un cadeau pour le sélectionner</small>
            </div>
        </div>

        <div id="selectedPreview" class="mb-4 d-none">
            <h5>Votre sélection :</h5>
            <div class="border rounded p-3 d-flex align-items-center">
                <div id="selectedImage"
                    style="width:96px;height:96px;background:#f1f1f1;border-radius:8px;display:flex;align-items:center;justify-content:center;">
                    <i class="bi bi-gift" style="font-size:2rem;color:#6c757d"></i>
                </div>
                <div class="ms-3">
                    <div id="selectedLibelle" class="fw-bold"></div>
                    <div id="selectedBarcode" class="text-muted small"></div>
                    <div id="selectedAgeRange" class="text-muted small"></div>
                </div>
            </div>
        </div>

        <form id="attributionForm" class="needs-validation" novalidate>
            <input type="hidden" id="residentId">

            <div class="mb-3">
                <label for="email" class="form-label">Email du destinataire <span class="text-danger">*</span></label>
                <input type="email" id="email" class="form-control" placeholder="adresse@mail.com" required>
                <div class="invalid-feedback">Un email valide est requis.</div>
            </div>

            <div class="mb-3">
                <label for="deliveryAddress" class="form-label">Adresse de livraison <span
                        class="text-danger">*</span></label>
                <textarea id="deliveryAddress" class="form-control" rows="2" placeholder="Adresse complète"
                    required></textarea>
                <div class="invalid-feedback">L'adresse de livraison est requise.</div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <div id="formMessage" class="me-3 flex-grow-1"></div>
                <div>
                    <button id="submitAttribution" class="btn btn-primary" type="submit">
                        <i class="bi bi-envelope-paper"></i> Envoyer
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
